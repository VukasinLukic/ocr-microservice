<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SV-20 Template Creator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --border-color: #334155;
            --danger-color: #ef4444;
        }

        * {
            box-sizing: border_box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            z-index: 10;
            box-shadow: 4px 0 24px rgba(0, 0, 0, 0.2);
        }

        .header {
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 8px;
            background: linear-gradient(to right, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 10px 16px;
            border-radius: 8px;
            border: none;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: white;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        .btn-secondary:hover {
            border-color: var(--text-primary);
            color: var(--text-primary);
        }

        .field-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 5px;
        }

        .field-item {
            padding: 12px;
            background-color: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }

        .field-item:hover {
            background-color: rgba(255, 255, 255, 0.06);
        }

        .field-item.active {
            border-color: var(--accent-color);
            background-color: rgba(59, 130, 246, 0.1);
        }

        .field-name {
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .field-meta {
            font-size: 0.75rem;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
        }

        .eye-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 4px;
            display: flex;
            align-items: center;
        }

        .eye-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        /* Main Canvas Area */
        .preview-area {
            flex: 1;
            position: relative;
            background-color: #0b101e;
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px;
            background-image: radial-gradient(#1e293b 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .canvas-container {
            position: relative;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        canvas {
            display: block;
            border-radius: 4px;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        #uploadInput {
            display: none;
        }

        .status-msg {
            position: absolute;
            bottom: 20px;
            right: 20px;
            padding: 10px 20px;
            border-radius: 8px;
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.5);
            color: #34d399;
            font-size: 0.875rem;
            transform: translateY(100px);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(10px);
        }

        .status-msg.show {
            transform: translateY(0);
        }

        /* Loading overlay */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
            display: none;
        }

        .loader.active {
            display: flex;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--accent-color);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="loader" id="loader">
        <div class="spinner"></div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="header">
            <h1>SV-20 Template Creator</h1>
            <p>Adjust fields & export template</p>
        </div>

        <div class="controls">
            <button class="btn btn-secondary" onclick="document.getElementById('uploadInput').click()">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                </svg>
                Upload Ref
            </button>
            <input type="file" id="uploadInput" accept="image/*,.pdf">

            <button class="btn btn-primary" onclick="saveTemplate()">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-4 4m0 0l-4-4m4 4V4">
                    </path>
                </svg>
                Save
            </button>

            <button id="circleModeBtn" class="btn btn-primary" onclick="toggleCircleMode()" style="display: none;">
                🎯 Edit Circles
            </button>
        </div>

        <div id="circleInfo" style="display: none; padding: 12px; background: rgba(34, 197, 94, 0.1); border: 1px solid #22c55e; border-radius: 8px; margin-bottom: 16px;">
            <div style="font-size: 11px; color: #94a3b8; margin-bottom: 4px;">CIRCLE MODE - Use ↑↓ arrows or click</div>
            <div style="font-weight: 600; color: #22c55e; font-size: 13px;" id="circleInfoText">-</div>
        </div>

        <div class="filters" style="display: flex; gap: 5px; margin-bottom: 10px;">
            <button class="btn btn-secondary" style="flex:1; padding: 6px; font-size: 0.75rem;"
                onclick="togglePage(1)">Page 1</button>
            <button class="btn btn-secondary" style="flex:1; padding: 6px; font-size: 0.75rem;"
                onclick="togglePage(2)">Page 2</button>
            <button class="btn btn-secondary" style="flex:1; padding: 6px; font-size: 0.75rem;" onclick="hideAll()">Hide
                All</button>
        </div>

        <!-- WS4: Alignment mode toggle - manuelne koordinate (default, nepromenjeno
             ponašanje) naspram anchor-based poravnanja preko logo/naslov sidara.
             Ne menja postojeću field/circle logiku, samo dodaje alternativni mod. -->
        <div class="alignment-toggle"
            style="margin-bottom: 16px; padding: 12px; background: rgba(255,255,255,0.03); border-radius: 8px; border: 1px solid var(--border-color);">
            <div style="font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 8px;">Poravnanje polja</div>
            <div style="display:flex; gap:5px;">
                <button id="alignManualBtn" class="btn btn-primary" style="flex:1; padding:6px; font-size:0.75rem;"
                    onclick="setAlignmentMode('manual')">Ručno</button>
                <button id="alignAnchorBtn" class="btn btn-secondary" style="flex:1; padding:6px; font-size:0.75rem;"
                    onclick="setAlignmentMode('anchor')">⚓ Anchor (beta)</button>
            </div>
            <button id="editAnchorsBtn" class="btn btn-secondary"
                style="width:100%; margin-top:8px; padding:6px; font-size:0.75rem; display:none;"
                onclick="toggleAnchorEditMode()">🎯 Uredi sidra</button>
            <div id="anchorHint" style="display:none; font-size: 0.7rem; color: var(--text-secondary); margin-top: 6px; line-height: 1.4;">
                Prevuci ljubičaste okvire preko stabilnih štampanih elemenata (npr. logo, naslov).
                Koordinate + isečak slike se čuvaju pri "Save".
            </div>
        </div>

        <div class="field-list" id="fieldList">
            <!-- Fields will be generated here -->
        </div>
    </div>

    <!-- Main Editor -->
    <div class="preview-area">
        <div class="canvas-container">
            <canvas id="editorCanvas"></canvas>
        </div>
    </div>

    <div class="status-msg" id="statusMsg">Template saved successfully!</div>

    <script>
        // State
        let template = null;
        let image = new Image();
        let scale = 1;
        let activeFieldId = null;
        let isDragging = false;
        let isResizing = false;

        // Circle Editing Mode (for OMR fields)
        let editMode = 'field'; // 'field', 'circles', or 'anchor'
        let activeCircles = []; // Array of circle objects for current OMR field
        let activeCircleIndex = null; // Currently selected circle
        let isDraggingCircle = false;
        let isResizingCircle = false; // NEW: Track circle resize state
        let dragStart = { x: 0, y: 0 };
        let activeRect = null;
        let resizeHandle = null;

        // WS4: Anchor Editing Mode (alignment sidra - "logo"/"title") - potpuno
        // odvojeno od field/circle logike iznad, koja ostaje netaknuta.
        let alignmentMode = 'manual'; // 'manual' ili 'anchor' (template.document.alignment_mode)
        let anchorEditMode = false; // da li je anchor-editing overlay trenutno aktivan
        let activeAnchors = []; // [{label, x, y, width, height, image_data}] - max 2
        let activeAnchorIndex = null;
        let isDraggingAnchor = false;
        let isResizingAnchor = false;

        const canvas = document.getElementById('editorCanvas');
        const ctx = canvas.getContext('2d');
        const fieldListEl = document.getElementById('fieldList');

        const HANDLE_SIZE = 8;
        const TARGET_WIDTH = 1024;

        // Initialization
        async function init() {
            showLoader(true);
            try {
                const res = await fetch('/api/template');
                const data = await res.json();
                template = data;

                // Initialize visibility state if not present
                if (template.fields) {
                    template.fields.forEach(f => {
                        if (typeof f._visible === 'undefined') f._visible = true;
                    });
                }

                initAnchors();
                setAlignmentMode(alignmentMode); // sync dugmadi sa učitanim stanjem

                renderFieldList();
            } catch (e) {
                console.error("Failed to load template", e);
                showStatus("Failed to load template", true);
            }
            showLoader(false);
        }

        // WS4: Anchor mode - inicijalizacija/toggle/edit
        function initAnchors() {
            if (!template.document) template.document = {};
            alignmentMode = template.document.alignment_mode || 'manual';

            const existing = template.document.anchor_elements || {};
            // Default pozicije preuzete iz originalnog (do sada neiskorišćenog)
            // document.anchor_elements.<label>.approximate_position u template-u.
            const defaults = {
                logo: { x: 50, y: 30, width: 150, height: 60 },
                title: { x: 650, y: 30, width: 220, height: 60 },
            };

            activeAnchors = Object.keys(defaults).map(label => {
                const e = existing[label];
                if (e && e.reference_position) {
                    // Nova šema (već sačuvana preko ovog editora)
                    return {
                        label,
                        x: e.reference_position.x,
                        y: e.reference_position.y,
                        width: e.reference_width || defaults[label].width,
                        height: e.reference_height || defaults[label].height,
                        image_data: e.image_data || null,
                    };
                }
                // Stara šema (approximate_position, samo tekst) ili ništa - koristi default
                const approx = e && e.approximate_position;
                return {
                    label,
                    x: approx ? approx.x : defaults[label].x,
                    y: approx ? approx.y : defaults[label].y,
                    width: defaults[label].width,
                    height: defaults[label].height,
                    image_data: null,
                };
            });
        }

        window.setAlignmentMode = function (mode) {
            alignmentMode = mode;
            if (template) {
                if (!template.document) template.document = {};
                template.document.alignment_mode = mode;
            }

            const manualBtn = document.getElementById('alignManualBtn');
            const anchorBtn = document.getElementById('alignAnchorBtn');
            const editBtn = document.getElementById('editAnchorsBtn');
            const hint = document.getElementById('anchorHint');

            manualBtn.className = mode === 'manual' ? 'btn btn-primary' : 'btn btn-secondary';
            anchorBtn.className = mode === 'anchor' ? 'btn btn-primary' : 'btn btn-secondary';
            editBtn.style.display = mode === 'anchor' ? 'block' : 'none';

            if (mode !== 'anchor' && anchorEditMode) {
                toggleAnchorEditMode(); // izađi iz anchor edit moda ako se prebacujemo na ručni
            }
            if (mode !== 'anchor') hint.style.display = 'none';

            draw();
        };

        window.toggleAnchorEditMode = function () {
            anchorEditMode = !anchorEditMode;

            if (anchorEditMode) {
                activeFieldId = null; // deselektuj polje da ne "krade" klikove
                editMode = 'anchor';
                activeAnchorIndex = 0;
            } else {
                editMode = 'field';
                activeAnchorIndex = null;
            }

            const btn = document.getElementById('editAnchorsBtn');
            btn.textContent = anchorEditMode ? '← Nazad na polja' : '🎯 Uredi sidra';
            btn.className = anchorEditMode ? 'btn btn-primary' : 'btn btn-secondary';
            document.getElementById('anchorHint').style.display = anchorEditMode ? 'block' : 'none';

            renderFieldList();
            draw();
        };

        function saveCurrentAnchors() {
            // Iseca trenutnu referentnu sliku na svakom anchor pravougaoniku i
            // čuva kao base64 PNG u template.document.anchor_elements - isti
            // "auto-save pri izlasku/save-u" obrazac kao saveCurrentCircles().
            if (!template) return;
            if (!template.document) template.document = {};
            if (!image || !image.src) {
                console.warn('[ANCHOR] Nema učitane referentne slike - anchor podaci se ne menjaju');
                return;
            }

            const anchorData = {};
            activeAnchors.forEach(anchor => {
                const off = document.createElement('canvas');
                off.width = Math.max(1, Math.round(anchor.width));
                off.height = Math.max(1, Math.round(anchor.height));
                const octx = off.getContext('2d');
                octx.drawImage(image, anchor.x, anchor.y, anchor.width, anchor.height,
                    0, 0, off.width, off.height);

                anchorData[anchor.label] = {
                    reference_position: { x: Math.round(anchor.x), y: Math.round(anchor.y) },
                    reference_width: off.width,
                    reference_height: off.height,
                    image_data: off.toDataURL('image/png'),
                };
            });

            template.document.anchor_elements = anchorData;
            console.log('[ANCHOR] Sačuvano', Object.keys(anchorData).length, 'sidara');
        }

        // Image Handling (with PDF support)
        // Page Management
        let currentPage = 1;
        let isPdf = false;

        async function loadPage(pageNum) {
            console.log(`[DEBUG] Loading page ${pageNum}`);
            if (!isPdf) {
                // If not PDF (or no file uploaded), we just update fields
                updateFieldVisibility(pageNum);
                return;
            }

            showLoader(true);
            try {
                const res = await fetch(`/api/template/render-page?page=${pageNum}`);
                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || "Failed to load page");
                }

                const data = await res.json();

                image = new Image();
                image.onload = () => {
                    canvas.width = TARGET_WIDTH;
                    const aspect = image.height / image.width;
                    canvas.height = TARGET_WIDTH * aspect;
                    currentPage = pageNum;
                    updateFieldVisibility(pageNum);
                    draw();
                };
                image.src = data.image_data;

            } catch (e) {
                console.error("Error loading page:", e);
                showStatus("Failed to load page: " + e.message, true);
                // Fallback: just update visibility
                updateFieldVisibility(pageNum);
            }
            showLoader(false);
        }

        function updateFieldVisibility(pageNum) {
            currentPage = pageNum;
            // Update visibility based on page number
            if (template) {
                template.fields.forEach(f => {
                    const fPage = f.page || 1;
                    f._visible = (fPage === pageNum);
                });
            }

            // Update buttons active state
            document.querySelectorAll('.filters .btn').forEach(b => b.classList.remove('btn-primary'));
            // This is a bit hacky selector, but works for now
            // const btn = document.querySelector(...) 

            renderFieldList();
            draw();
        }

        window.togglePage = function (pageNum) {
            loadPage(pageNum);
        };

        window.hideAll = function () {
            if (!template) return;
            template.fields.forEach(f => f._visible = false);
            activeFieldId = null;
            renderFieldList();
            draw();
        };

        // File Upload Handler Update
        document.getElementById('uploadInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            showLoader(true);
            try {
                const formData = new FormData();
                formData.append('file', file);

                const res = await fetch('/api/template/render-upload', {
                    method: 'POST',
                    body: formData
                });

                if (!res.ok) throw new Error("Upload failed");
                const data = await res.json();

                isPdf = data.is_pdf; // Store flag
                console.log(`[DEBUG] Uploaded. Is PDF: ${isPdf}`);

                image = new Image();
                image.onload = () => {
                    canvas.width = TARGET_WIDTH;
                    const aspect = image.height / image.width;
                    canvas.height = TARGET_WIDTH * aspect;
                    // Default to page 1
                    currentPage = 1;
                    updateFieldVisibility(1);
                    draw();
                };
                image.src = data.image_data;
                showStatus("Reference loaded!");

            } catch (err) {
                console.error(err);
                showStatus("Error: " + err.message, true);
            }
            showLoader(false);
            e.target.value = '';
        });

        // Rendering
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Image
            if (image.src) {
                ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = "#1e293b";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#475569";
                ctx.font = "20px Inter";
                ctx.textAlign = "center";
                ctx.fillText("Upload an image to start editing", canvas.width / 2, canvas.height / 2);
            }

            // Draw Overlay
            ctx.fillStyle = "rgba(0,0,0,0.3)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (!template) return;

            // Draw Fields
            template.fields.forEach(field => {
                // Check visibility
                if (!field._visible) return;

                const { x, y, width, height } = field.coordinates;
                const isActive = field.id === activeFieldId;

                // Box
                ctx.beginPath();
                ctx.rect(x, y, width, height);
                ctx.fillStyle = isActive ? "rgba(59, 130, 246, 0.2)" : "rgba(255, 255, 255, 0.05)";
                ctx.fill();
                ctx.lineWidth = isActive ? 2 : 1;
                ctx.strokeStyle = isActive ? "#3b82f6" : "rgba(255,255,255,0.4)";
                ctx.stroke();

                // Handles
                if (isActive) {
                    drawHandles(x, y, width, height);
                }

                // Label
                ctx.fillStyle = isActive ? "#3b82f6" : "#cbd5e1";
                ctx.font = "12px Inter";
                ctx.fillText(field.id, x + 2, y - 4);
            });

            // Draw Circles (for OMR fields in circle mode)
            if (editMode === 'circles' && activeCircles.length > 0) {
                activeCircles.forEach((circle, idx) => {
                    const isActiveCircle = idx === activeCircleIndex;
                    const { x, y, width, height } = circle;

                    // Circle box
                    ctx.beginPath();
                    ctx.rect(x, y, width, height);
                    ctx.fillStyle = isActiveCircle ? "rgba(34, 197, 94, 0.3)" : "rgba(251, 191, 36, 0.2)";
                    ctx.fill();
                    ctx.lineWidth = isActiveCircle ? 3 : 2;
                    ctx.strokeStyle = isActiveCircle ? "#22c55e" : "#fbbf24";
                    ctx.stroke();

                    // Circle label
                    ctx.fillStyle = isActiveCircle ? "#22c55e" : "#fbbf24";
                    ctx.font = "bold 14px Inter";
                    ctx.textAlign = "left";
                    ctx.fillText(circle.label, x + 4, y + 16);

                    // Circle value (smaller text)
                    ctx.font = "10px Inter";
                    ctx.fillStyle = "#fff";
                    const valueTrunc = circle.value.length > 15 ? circle.value.substring(0, 15) + "..." : circle.value;
                    ctx.fillText(valueTrunc, x + 4, y + height - 4);

                    // Handles for active circle
                    if (isActiveCircle) {
                        drawHandles(x, y, width, height);
                    }
                });
            }

            // WS4: Draw Anchors (alignment mode)
            if (editMode === 'anchor') {
                activeAnchors.forEach((anchor, idx) => {
                    const isActiveAnchor = idx === activeAnchorIndex;
                    const { x, y, width, height } = anchor;

                    ctx.beginPath();
                    ctx.rect(x, y, width, height);
                    ctx.fillStyle = isActiveAnchor ? "rgba(168, 85, 247, 0.35)" : "rgba(168, 85, 247, 0.15)";
                    ctx.fill();
                    ctx.lineWidth = isActiveAnchor ? 3 : 2;
                    ctx.strokeStyle = "#a855f7";
                    ctx.setLineDash([6, 4]);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    ctx.fillStyle = "#a855f7";
                    ctx.font = "bold 13px Inter";
                    ctx.textAlign = "left";
                    ctx.fillText(`⚓ ${anchor.label}`, x + 4, y - 6);

                    if (isActiveAnchor) drawHandles(x, y, width, height);
                });
            }
        }

        function drawHandles(x, y, w, h) {
            ctx.fillStyle = "#3b82f6";
            const s = HANDLE_SIZE;
            ctx.fillRect(x - s / 2, y - s / 2, s, s);
            ctx.fillRect(x + w - s / 2, y - s / 2, s, s);
            ctx.fillRect(x + w - s / 2, y + h - s / 2, s, s);
            ctx.fillRect(x - s / 2, y + h - s / 2, s, s);
        }

        // MOUSE DOWN - Start drag/resize
        canvas.addEventListener('mousedown', (e) => {
            const pos = getMousePos(e);

            // WS4 ANCHOR MODE: Check if clicking on anchor rectangles
            if (editMode === 'anchor' && activeAnchors.length > 0) {
                if (activeAnchorIndex !== null) {
                    const activeAnchor = activeAnchors[activeAnchorIndex];
                    const handle = getResizeHandle(pos.x, pos.y, activeAnchor);
                    if (handle) {
                        isResizingAnchor = true;
                        resizeHandle = handle;
                        dragStart = { x: pos.x, y: pos.y };
                        activeRect = { ...activeAnchor };
                        return;
                    }
                }

                for (let idx = activeAnchors.length - 1; idx >= 0; idx--) {
                    const anchor = activeAnchors[idx];
                    if (isPointInRect(pos.x, pos.y, anchor)) {
                        activeAnchorIndex = idx;
                        isDraggingAnchor = true;
                        dragStart = { x: pos.x, y: pos.y };
                        activeRect = { ...anchor };
                        draw();
                        return;
                    }
                }
                return; // u anchor modu ne propuštamo klik dalje na polja
            }

            // CIRCLE MODE: Check if clicking on circles
            if (editMode === 'circles' && activeCircles.length > 0) {
                // First check if clicking on active circle's resize handle
                if (activeCircleIndex !== null) {
                    const activeCircle = activeCircles[activeCircleIndex];
                    const handle = getResizeHandle(pos.x, pos.y, activeCircle);
                    if (handle) {
                        isResizingCircle = true;
                        resizeHandle = handle;
                        dragStart = { x: pos.x, y: pos.y };
                        activeRect = { ...activeCircle };
                        console.log(`[CIRCLE] Start resizing circle ${activeCircle.label} from handle ${handle}`);
                        return;
                    }
                }

                // Then check if clicking on any circle (to select and drag)
                for (let idx = activeCircles.length - 1; idx >= 0; idx--) {
                    const circle = activeCircles[idx];
                    if (isPointInRect(pos.x, pos.y, circle)) {
                        activeCircleIndex = idx;
                        isDraggingCircle = true;
                        dragStart = { x: pos.x, y: pos.y };
                        activeRect = { ...circle };
                        updateCircleInfo();
                        draw();
                        console.log(`[CIRCLE] Start dragging circle ${circle.label}`);
                        return;
                    }
                }
            }

            // FIELD MODE: First check if clicking on an active field's resize handle
            if (editMode === 'field' && activeFieldId) {
                const activeField = template.fields.find(f => f.id === activeFieldId);
                if (activeField && activeField._visible) {
                    const handle = getResizeHandle(pos.x, pos.y, activeField.coordinates);
                    if (handle) {
                        isResizing = true;
                        resizeHandle = handle;
                        dragStart = { x: pos.x, y: pos.y };
                        activeRect = { ...activeField.coordinates };
                        return;
                    }
                }
            }

            // Check if clicking on any visible field
            for (const field of template.fields) {
                if (!field._visible) continue;
                if (isPointInRect(pos.x, pos.y, field.coordinates)) {
                    activeFieldId = field.id;
                    isDragging = true;
                    dragStart = { x: pos.x, y: pos.y };
                    activeRect = { ...field.coordinates };
                    renderFieldList();
                    draw();
                    return;
                }
            }

            // Click on empty space - deselect
            activeFieldId = null;
            renderFieldList();
            draw();
        });

        canvas.addEventListener('mousemove', (e) => {
            const pos = getMousePos(e);

            // WS4 ANCHOR RESIZING
            if (isResizingAnchor && activeAnchorIndex !== null) {
                const anchor = activeAnchors[activeAnchorIndex];
                const dx = pos.x - dragStart.x;
                const dy = pos.y - dragStart.y;

                if (resizeHandle === 'nw') {
                    anchor.x = Math.round(activeRect.x + dx);
                    anchor.y = Math.round(activeRect.y + dy);
                    anchor.width = Math.max(20, activeRect.width - dx);
                    anchor.height = Math.max(20, activeRect.height - dy);
                } else if (resizeHandle === 'ne') {
                    anchor.y = Math.round(activeRect.y + dy);
                    anchor.width = Math.max(20, activeRect.width + dx);
                    anchor.height = Math.max(20, activeRect.height - dy);
                } else if (resizeHandle === 'se') {
                    anchor.width = Math.max(20, activeRect.width + dx);
                    anchor.height = Math.max(20, activeRect.height + dy);
                } else if (resizeHandle === 'sw') {
                    anchor.x = Math.round(activeRect.x + dx);
                    anchor.width = Math.max(20, activeRect.width - dx);
                    anchor.height = Math.max(20, activeRect.height + dy);
                }
                draw();
                return;
            }

            // WS4 ANCHOR DRAGGING
            if (isDraggingAnchor && activeAnchorIndex !== null) {
                const anchor = activeAnchors[activeAnchorIndex];
                const dx = pos.x - dragStart.x;
                const dy = pos.y - dragStart.y;

                anchor.x = Math.round(activeRect.x + dx);
                anchor.y = Math.round(activeRect.y + dy);
                draw();
                return;
            }

            // Cursor for WS4 ANCHOR MODE
            if (editMode === 'anchor' && activeAnchorIndex !== null && !isDraggingAnchor && !isResizingAnchor) {
                const anchor = activeAnchors[activeAnchorIndex];
                const handle = getResizeHandle(pos.x, pos.y, anchor);
                if (handle) {
                    canvas.style.cursor = handle + '-resize';
                    return;
                } else if (isPointInRect(pos.x, pos.y, anchor)) {
                    canvas.style.cursor = 'move';
                    return;
                }
            }

            // CIRCLE RESIZING
            if (isResizingCircle && activeCircleIndex !== null) {
                const circle = activeCircles[activeCircleIndex];
                const dx = pos.x - dragStart.x;
                const dy = pos.y - dragStart.y;

                if (resizeHandle === 'nw') {
                    circle.x = Math.round(activeRect.x + dx);
                    circle.y = Math.round(activeRect.y + dy);
                    circle.width = Math.max(20, activeRect.width - dx);
                    circle.height = Math.max(20, activeRect.height - dy);
                } else if (resizeHandle === 'ne') {
                    circle.y = Math.round(activeRect.y + dy);
                    circle.width = Math.max(20, activeRect.width + dx);
                    circle.height = Math.max(20, activeRect.height - dy);
                } else if (resizeHandle === 'se') {
                    circle.width = Math.max(20, activeRect.width + dx);
                    circle.height = Math.max(20, activeRect.height + dy);
                } else if (resizeHandle === 'sw') {
                    circle.x = Math.round(activeRect.x + dx);
                    circle.width = Math.max(20, activeRect.width - dx);
                    circle.height = Math.max(20, activeRect.height + dy);
                }
                draw();
                return;
            }

            // CIRCLE DRAGGING
            if (isDraggingCircle && activeCircleIndex !== null) {
                const circle = activeCircles[activeCircleIndex];
                const dx = pos.x - dragStart.x;
                const dy = pos.y - dragStart.y;

                circle.x = Math.round(activeRect.x + dx);
                circle.y = Math.round(activeRect.y + dy);
                draw();
                return;
            }

            // Cursor for CIRCLE MODE
            if (editMode === 'circles' && activeCircleIndex !== null && !isDraggingCircle && !isResizingCircle) {
                const circle = activeCircles[activeCircleIndex];
                const handle = getResizeHandle(pos.x, pos.y, circle);
                if (handle) {
                    canvas.style.cursor = handle + '-resize';
                    return;
                } else if (isPointInRect(pos.x, pos.y, circle)) {
                    canvas.style.cursor = 'move';
                    return;
                }
            }

            // Cursor for FIELD MODE
            if (editMode === 'field' && activeFieldId && !isDragging) {
                const field = template.fields.find(f => f.id === activeFieldId);
                if (field && field._visible) {
                    const handle = getResizeHandle(pos.x, pos.y, field.coordinates);
                    if (handle) canvas.style.cursor = handle + '-resize';
                    else if (isPointInRect(pos.x, pos.y, field.coordinates)) canvas.style.cursor = 'move';
                    else canvas.style.cursor = 'default';
                }
            } else if (!isDragging && !isResizing) {
                canvas.style.cursor = 'default';
            }

            if (isDragging && activeFieldId) {
                const field = template.fields.find(f => f.id === activeFieldId);
                const dx = pos.x - dragStart.x;
                const dy = pos.y - dragStart.y;

                field.coordinates.x = activeRect.x + dx;
                field.coordinates.y = activeRect.y + dy;
                draw();
            }

            if (isResizing && activeFieldId) {
                const field = template.fields.find(f => f.id === activeFieldId);
                const dx = pos.x - dragStart.x;
                const dy = pos.y - dragStart.y;

                if (resizeHandle === 'nw') {
                    field.coordinates.x = Math.round(activeRect.x + dx);
                    field.coordinates.y = Math.round(activeRect.y + dy);
                    field.coordinates.width = Math.max(10, activeRect.width - dx);
                    field.coordinates.height = Math.max(10, activeRect.height - dy);
                } else if (resizeHandle === 'ne') {
                    field.coordinates.y = Math.round(activeRect.y + dy);
                    field.coordinates.width = Math.max(10, activeRect.width + dx);
                    field.coordinates.height = Math.max(10, activeRect.height - dy);
                } else if (resizeHandle === 'se') {
                    field.coordinates.width = Math.max(10, activeRect.width + dx);
                    field.coordinates.height = Math.max(10, activeRect.height + dy);
                } else if (resizeHandle === 'sw') {
                    field.coordinates.x = Math.round(activeRect.x + dx);
                    field.coordinates.width = Math.max(10, activeRect.width - dx);
                    field.coordinates.height = Math.max(10, activeRect.height + dy);
                }
                draw();
            }
        });

        // Keyboard Navigation for Circles (and WS4 Anchors)
        window.addEventListener('keydown', (e) => {
            if (editMode === 'circles' && activeCircles.length > 0) {
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    activeCircleIndex = (activeCircleIndex + 1) % activeCircles.length;
                    updateCircleInfo();
                    draw();
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    activeCircleIndex = (activeCircleIndex - 1 + activeCircles.length) % activeCircles.length;
                    updateCircleInfo();
                    draw();
                }
            } else if (editMode === 'anchor' && activeAnchors.length > 0) {
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    activeAnchorIndex = (activeAnchorIndex + 1) % activeAnchors.length;
                    draw();
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    activeAnchorIndex = (activeAnchorIndex - 1 + activeAnchors.length) % activeAnchors.length;
                    draw();
                }
            }
        });

        window.addEventListener('mouseup', () => {
            // WS4 anchor resizing end
            if (isResizingAnchor) {
                isResizingAnchor = false;
                if (activeAnchorIndex !== null) {
                    const anchor = activeAnchors[activeAnchorIndex];
                    anchor.x = Math.round(anchor.x);
                    anchor.y = Math.round(anchor.y);
                    anchor.width = Math.round(anchor.width);
                    anchor.height = Math.round(anchor.height);
                }
                draw();
                return;
            }

            // WS4 anchor dragging end
            if (isDraggingAnchor) {
                isDraggingAnchor = false;
                if (activeAnchorIndex !== null) {
                    const anchor = activeAnchors[activeAnchorIndex];
                    anchor.x = Math.round(anchor.x);
                    anchor.y = Math.round(anchor.y);
                }
                draw();
                return;
            }

            // Circle resizing end
            if (isResizingCircle) {
                isResizingCircle = false;
                if (activeCircleIndex !== null) {
                    const circle = activeCircles[activeCircleIndex];
                    circle.x = Math.round(circle.x);
                    circle.y = Math.round(circle.y);
                    circle.width = Math.round(circle.width);
                    circle.height = Math.round(circle.height);
                    console.log(`[CIRCLE] Resized circle ${circle.label} to (${circle.x}, ${circle.y}, ${circle.width}x${circle.height})`);
                    updateCircleInfo();
                }
                draw();
                return;
            }

            // Circle dragging end
            if (isDraggingCircle) {
                isDraggingCircle = false;
                if (activeCircleIndex !== null) {
                    const circle = activeCircles[activeCircleIndex];
                    circle.x = Math.round(circle.x);
                    circle.y = Math.round(circle.y);
                    console.log(`[CIRCLE] Moved circle ${circle.label} to (${circle.x}, ${circle.y})`);
                    updateCircleInfo();
                }
                draw();
                return;
            }

            // Field dragging/resizing end
            if (isDragging || isResizing) {
                isDragging = false;
                isResizing = false;
                if (activeFieldId) {
                    const field = template.fields.find(f => f.id === activeFieldId);
                    field.coordinates.x = Math.round(field.coordinates.x);
                    field.coordinates.y = Math.round(field.coordinates.y);
                    field.coordinates.width = Math.round(field.coordinates.width);
                    field.coordinates.height = Math.round(field.coordinates.height);
                }
                draw();
            }
        });

        // Helpers
        function getMousePos(evt) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return {
                x: (evt.clientX - rect.left) * scaleX,
                y: (evt.clientY - rect.top) * scaleY
            };
        }

        function isPointInRect(x, y, rect) {
            return x >= rect.x && x <= rect.x + rect.width &&
                y >= rect.y && y <= rect.y + rect.height;
        }

        function getResizeHandle(x, y, rect) {
            const s = HANDLE_SIZE + 4;

            // Check all four corners
            // North-West (top-left)
            if (x >= rect.x - s && x <= rect.x + s &&
                y >= rect.y - s && y <= rect.y + s) {
                return 'nw';
            }
            // North-East (top-right)
            if (x >= rect.x + rect.width - s && x <= rect.x + rect.width + s &&
                y >= rect.y - s && y <= rect.y + s) {
                return 'ne';
            }
            // South-East (bottom-right)
            if (x >= rect.x + rect.width - s && x <= rect.x + rect.width + s &&
                y >= rect.y + rect.height - s && y <= rect.y + rect.height + s) {
                return 'se';
            }
            // South-West (bottom-left)
            if (x >= rect.x - s && x <= rect.x + s &&
                y >= rect.y + rect.height - s && y <= rect.y + rect.height + s) {
                return 'sw';
            }

            return null;
        }

        // Sidebar Rendering
        function renderFieldList() {
            fieldListEl.innerHTML = '';
            template.fields.forEach(field => {
                const el = document.createElement('div');
                el.className = `field-item ${field.id === activeFieldId ? 'active' : ''}`;

                // Click to select
                el.onclick = (e) => {
                    // Ignore clicks on the eye button
                    if (e.target.closest('.eye-btn')) return;
                    setActiveField(field.id);
                };

                const page = field.page || 1;
                const isVisible = field._visible;

                el.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: start;">
                        <div class="field-name">${field.id}. ${field.name}</div>
                        <button class="eye-btn" onclick="toggleFieldVisibility(${field.id}, this)">
                            ${getEyeIcon(isVisible)}
                        </button>
                    </div>
                    <div class="field-meta">
                        <span>${field.type}</span>
                        <span style="background: rgba(255,255,255,0.1); padding: 1px 4px; border-radius: 4px;">p${page}</span>
                    </div>
                `;
                fieldListEl.appendChild(el);
            });
        }

        function getEyeIcon(visible) {
            if (visible) {
                return `<svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>`;
            } else {
                return `<svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="#64748b"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" /></svg>`;
            }
        }

        function setActiveField(id) {
            // WS4: ako je anchor edit mod aktivan (npr. klik na polje u sidebaru
            // dok se uređuju sidra), čisto izađi iz njega da UI dugmad ne ostanu
            // neusklađena sa stvarnim editMode-om.
            if (anchorEditMode) {
                toggleAnchorEditMode();
            }

            // VAŽNO: Sačuvaj koordinate trenutnog polja PRE nego što pređeš na novo!
            if (activeFieldId && activeFieldId !== id) {
                saveCurrentCircles();
            }

            activeFieldId = id;

            // Ensure visible when finding
            const field = template.fields.find(f => f.id === id);
            if (field && !field._visible) {
                field._visible = true;
            }

            // Initialize circles for OMR fields
            if (field && (field.type === 'OMR_SINGLE' || field.type === 'OMR_MULTI')) {
                initCirclesForField(field);
            } else {
                // Not OMR - exit circle mode
                editMode = 'field';
                activeCircles = [];
                activeCircleIndex = null;
            }

            renderFieldList();
            updateModeUI();
            draw();
        }

        function saveCurrentCircles() {
            // Sačuvaj koordinate krugova trenutno aktivnog polja
            if (!activeFieldId || activeCircles.length === 0) return;

            const field = template.fields.find(f => f.id === activeFieldId);
            if (!field || !field.omr_options) return;

            console.log('[AUTO-SAVE] Saving circle coordinates for field:', field.name);

            field.omr_options = field.omr_options.map((opt, idx) => {
                const circle = activeCircles[idx];
                if (circle) {
                    return {
                        ...opt,
                        x: circle.x,
                        y: circle.y,
                        width: circle.width,
                        height: circle.height
                    };
                }
                return opt;
            });

            console.log('[AUTO-SAVE] ✓ Saved', activeCircles.length, 'circles');
        }

        function initCirclesForField(field) {
            console.log('[CIRCLE MODE] Initializing circles for field:', field.name);
            activeCircles = [];

            const omr_options = field.omr_options || [];
            const fieldCoords = field.coordinates;

            omr_options.forEach((opt, idx) => {
                let circleX, circleY, circleW, circleH;

                // If option already has absolute coordinates, use them
                if (opt.x !== undefined && opt.y !== undefined) {
                    circleX = opt.x;
                    circleY = opt.y;
                    circleW = opt.width || 60;
                    circleH = opt.height || 40;
                } else {
                    // Auto-position vertically within field ROI
                    const numOptions = omr_options.length;
                    const optHeight = fieldCoords.height / numOptions;

                    circleX = fieldCoords.x + 5;
                    circleY = fieldCoords.y + (idx * optHeight) + 2;
                    circleW = Math.min(fieldCoords.width - 10, 150);
                    circleH = optHeight - 4;
                }

                activeCircles.push({
                    label: opt.label || String(idx + 1),
                    value: opt.value || `Option ${idx + 1}`,
                    x: circleX,
                    y: circleY,
                    width: circleW,
                    height: circleH
                });
            });

            console.log(`[CIRCLE MODE] Initialized ${activeCircles.length} circles`);
        }

        function updateModeUI() {
            const field = template.fields.find(f => f.id === activeFieldId);
            const circleModeBtn = document.getElementById('circleModeBtn');
            const circleInfo = document.getElementById('circleInfo');

            if (field && (field.type === 'OMR_SINGLE' || field.type === 'OMR_MULTI')) {
                // Show circle mode button
                circleModeBtn.style.display = 'block';
                circleModeBtn.textContent = editMode === 'circles' ? '← Field Mode' : '🎯 Edit Circles';
                circleModeBtn.className = editMode === 'circles' ? 'btn btn-secondary' : 'btn btn-primary';

                // Show/hide circle info panel
                if (editMode === 'circles') {
                    circleInfo.style.display = 'block';
                    updateCircleInfo();
                } else {
                    circleInfo.style.display = 'none';
                }
            } else {
                circleModeBtn.style.display = 'none';
                circleInfo.style.display = 'none';
            }
        }

        function updateCircleInfo() {
            const circleInfoText = document.getElementById('circleInfoText');
            if (activeCircleIndex !== null && activeCircles[activeCircleIndex]) {
                const circle = activeCircles[activeCircleIndex];
                circleInfoText.textContent = `Circle ${circle.label}: "${circle.value}" (${circle.x}, ${circle.y})`;
            } else {
                circleInfoText.textContent = 'No circle selected';
            }
        }

        window.toggleCircleMode = function() {
            if (editMode === 'field') {
                editMode = 'circles';
                activeCircleIndex = 0; // Select first circle
            } else {
                // Izlazimo iz Circle Mode - AUTO-SAVE!
                saveCurrentCircles();
                editMode = 'field';
                activeCircleIndex = null;
            }

            updateModeUI();
            draw();
        };

        // Toggle individual field visibility
        window.toggleFieldVisibility = function(id, btnElement) {
            const field = template.fields.find(f => f.id === id);
            if (!field) return;

            field._visible = !field._visible;

            // Update the icon
            if (btnElement) {
                btnElement.innerHTML = getEyeIcon(field._visible);
            }

            // If hiding the active field, deselect it
            if (!field._visible && activeFieldId === id) {
                activeFieldId = null;
            }

            renderFieldList();
            draw();
        };

        // API
        async function saveTemplate() {
            if (!template) return;

            // VAŽNO: AUTO-SAVE trenutnih krugova pre nego što sačuvamo template!
            saveCurrentCircles();
            saveCurrentAnchors(); // WS4 - snimi anchor pravougaonike (ako su menjani)

            showLoader(true);

            // Clean up internal _visible props before saving
            const cleanTemplate = JSON.parse(JSON.stringify(template));
            cleanTemplate.fields.forEach(f => delete f._visible);

            try {
                const res = await fetch('/api/template/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(cleanTemplate)
                });

                if (res.ok) {
                    showStatus("Template saved successfully!");
                } else {
                    const err = await res.text();
                    showStatus("Error saving: " + err, true);
                }
            } catch (e) {
                showStatus("Network error", true);
            }
            showLoader(false);
        }

        function showStatus(msg, isError) {
            const el = document.getElementById('statusMsg');
            el.textContent = msg;
            el.style.color = isError ? '#ef4444' : '#34d399';
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 3000);
        }

        function showLoader(show) {
            document.getElementById('loader').classList.toggle('active', show);
        }

        init();
    </script>
</body>
